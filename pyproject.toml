[project]
name = "doc-extraction"
version = "0.1.0"
description = "Extract investment-memo PDFs with Nemotron Parse 2.0 on DGX Spark and compare Docling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "beautifulsoup4",
    "docling",
    "einops==0.8.1",
    "huggingface-hub[hf_xet]",
    "open-clip-torch==3.2.0",
    "pillow",
    "pypdfium2",
    "reportlab",
    "timm==1.0.22",
    "torch",
    "torchvision",
    "transformers==5.6.1",
]

[project.scripts]
doc-extract = "doc_extraction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/doc_extraction"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
